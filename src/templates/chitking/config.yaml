schema_version: 1
stages:
  - seed
  - briefed
  - gap-identified
  - specified
  - verification-planned
  - implementation-ready
  - evidence-recorded
  - synthesis-ready
stage_advancement:
  seed: 1
  briefed: 1
  gap-identified: 2
  specified: 2
  verification-planned: 3
  implementation-ready: 4
  evidence-recorded: 4
  synthesis-ready: 5
maturity_levels:
  - nascent
  - developing
  - established
  - mature
stage_criteria:
  seed:
    - { section: "Theory Brief", check: non-empty }
    - { section: "Current Claim", check: non-empty }
  briefed:
    - { section: "Capability Gap", check: non-empty }
  gap-identified:
    - { section: "Verification Obligations", check: min-bullets, value: 1 }
  specified:
    - { section: "Next Safe Actions", check: min-bullets, value: 1 }
  verification-planned:
    - { section: "Verification Obligations", check: min-words, value: 20 }
  implementation-ready:
    - { section: "Next Safe Actions", check: min-words, value: 20 }
  evidence-recorded:
    - { section: "Evidence", check: min-bullets, value: 2 }
  synthesis-ready:
    - { section: "Evidence", check: min-bullets, value: 3 }
    - { section: "Failed Paths", check: non-empty }
maturity_criteria:
  developing:
    - { section: "Theory Brief", check: min-words, value: 20 }
    - { section: "Current Claim", check: non-empty }
  established:
    - { section: "Evidence", check: min-bullets, value: 3 }
    - { section: "Failed Paths", check: non-empty }
  mature:
    - { history_contains: "cycle complete" }
roles:
  plan:
    min_stage: briefed
    min_readiness: 1
    warnings:
      - Stop before assigning implementation work.
    prompt:
      objective: Turn the theory brief and capability gap into a safe research plan.
      stop_conditions:
        - The thread lacks a clear current claim.
        - The next action would require implementation without a human checkpoint.
  dreamer:
    min_stage: seed
    min_readiness: 1
    warnings:
      - Dreamer is ideation-only; do not create implementation tasks.
      - Dreamer output requires human, oracle, or planner review before implementation.
      - Never hand Dreamer work directly to build or Executor roles.
    prompt:
      objective: Generate hypotheses, strange analogies, candidate mechanisms, edge cases, and possible theory directions from the theory brief, open questions, constraints, unresolved objections, and failed paths.
      stop_conditions:
        - The output would create or assign implementation tasks.
        - The output would hand work directly to build or Executor roles.
        - The ideation candidate is being treated as approved implementation work without human, oracle, or planner review.
  build:
    min_stage: implementation-ready
    min_readiness: 4
    warnings:
      - Build work is risky before verification obligations are explicit.
    prompt:
      objective: Implement only the approved next safe action for this research thread.
      stop_conditions:
        - The thread is below implementation-ready stage.
        - The task requires changing stage or readiness.
  predict:
    min_stage: gap-identified
    min_readiness: 2
    warnings:
      - Predict is prediction-only; do not create implementation tasks.
      - Predict output requires human, oracle, planner, or reviewer review before implementation.
      - Never hand Predict output directly to build or Executor roles.
      - Predict output must not be presented as an approved next safe action.
    prompt:
      objective: Propose the next concrete experiment as an explicit, falsifiable prediction with a cited source.
      stop_conditions:
        - The output would create or assign implementation tasks.
        - The output would hand work directly to build or Executor roles.
        - The prediction is missing a cited Source.
        - The prediction is missing a Falsification Criterion.
        - The prediction is being treated as an approved next safe action without human, oracle, planner, or reviewer review.
  verify:
    min_stage: verification-planned
    min_readiness: 3
    warnings:
      - Verification should cite concrete obligations from the thread.
      - When checking obligations, cite specific Falsification Criteria from the Predictions section when available.
    prompt:
      objective: Check whether evidence satisfies the thread's verification obligations.
      stop_conditions:
        - Verification obligations are missing or ambiguous.
        - A finding would change readiness without oracle or human review.
  synthesize:
    min_stage: synthesis-ready
    min_readiness: 5
    warnings:
      - Synthesis should wait until evidence is recorded and reviewed.
    prompt:
      objective: Synthesize stable conclusions from recorded evidence and failed paths.
      stop_conditions:
        - Evidence is too thin for synthesis.
        - The synthesis would hide unresolved capability gaps.
  review:
    min_stage: specified
    min_readiness: 2
    warnings:
      - Review is advisory; do not mutate readiness or stage.
    prompt:
      objective: Review thread consistency, risk, and readiness evidence for a human checkpoint.
      stop_conditions:
        - The review requires oracle judgment.
        - The thread source of truth is missing required sections.
  oracle:
    min_stage: specified
    min_readiness: 2
    warnings:
      - Oracle output may recommend readiness, but humans must apply it.
    prompt:
      objective: Provide explicit readiness and stage judgment for human consideration.
      stop_conditions:
        - The judgment depends on unrecorded work.
        - The requested change would bypass a human checkpoint.
project_incomplete_markers:
  - TODO
  - TBD
  - "<"
  - ">"
  - "..."
